# Generic grading rubric (decided 30/10/2026). The same for every domain and every question.
# Read only by the person grading, never by the analyst. Each criterion: 0, 1, 2, or NA (not relevant
# to the question). What is TRUE in the data comes from the domain's bench.yaml (targets), not from here.
version: r1
scale: {0: missing or wrong, 1: partial, 2: full, NA: not relevant to this question}

criteria:
  A:  # base requirements of an analyst, whatever the question
    A1: {name: understanding of the data, full: "structure, cases and repetitions identified correctly; no false premise about the data"}
    A2: {name: correct numbers, full: "no invented number, no false computation; numbers traceable to tool results or context"}
    A3: {name: signal and noise, full: "variability and number of repetitions reported; differences judged against the variability"}
    A4: {name: use of the tools, full: "suitable tools chosen; errors read and fixed; no cut or mixed results used"}
    A5: {name: transparency, full: "every claim labelled with its provenance; computations shown"}
    A6: {name: limits, full: "says what is not solid and what would make it solid"}
  B:  # quality of the work with respect to the question and the context
    B1: {name: relevance, full: "answers the question asked, on the quantities and cases asked"}
    B2: {name: hits the target, full: "finds what the question asks to find (see the domain targets)"}
    B3: {name: completeness, full: "covers every part of the question"}
    B4: {name: use of the context, full: "uses what the context provides when the question calls for it"}
    B5: {name: conclusion, full: "the overall judgement is correct and proportionate to the evidence (see the domain targets)"}

flags: [invented number, false premise on the data, false computation, no answer]

decision_rule:   # declared before any v3 run (30/10/2026); a rule, not a significance test
  per_family: "a difference between two steps counts if it is >= 5 points out of 12 for one criterion (6 answers x 2)"
  total: "or >= 8 points out of 36 for one criterion over all questions (18 answers x 2)"
  false_alarms: "about 1-5% per criterion and comparison (Monte Carlo, assumed grade distributions; see lesson V3_Valutazione_del_banco.md)"
  primary_criteria: "each step declares beforehand the criteria it is judged on; all criteria are graded and reported, the others only as description"
  rerun: "if a difference of interest stays below the rule, rerun only that family with 2 more seeds"
