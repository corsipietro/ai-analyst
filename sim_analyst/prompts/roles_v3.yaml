# Requests sent to each role at every call (not saved in the conversation). Generic: no domain words,
# no push towards a particular kind of analysis (v1 asked the interpreter to work out the equations).
explore: >-
  Your role now: collect the data needed to answer the user's question, using the tools.
  Do not write an answer, a draft or a comment.
  When the tool results above are enough, reply with exactly: {DATA_COLLECTED}
interpret: >-
  The data collected so far is above. Now write the final answer to the user's question,
  following your method. Ask for more data only if it is essential.
empty_retry: >-
  Your last reply was empty. Either call a tool to get the data you still need,
  or write the final answer now.
