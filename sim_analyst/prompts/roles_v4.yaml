# Requests of the ReWOO graph (rewoo.py), sent at every call and not saved in the conversation.
# Generic: no domain words. v4 = v3 method with one line changed (numbers come from tools or calculate).
plan: >-
  Your role now: write the plan of tool calls needed to answer the user's question,
  each with its reason (why). You will not see the results now: the plan is run for you,
  and the results are given to an analyst who writes the answer. Use only the data tools,
  at most 8 steps, and take every column name and value from the database description.
repair: >-
  Some steps of your plan failed. Read each error: it says what to change. Write only the steps
  that replace the failed ones, with corrected arguments, and add a step only if an error shows
  it is needed; do not repeat the steps that worked. You will not see the results now.
repair_retry: >-
  Your repair steps were refused for these reasons: {problems}. Write the replacement steps again,
  fixing them; do not repeat the steps that worked.
analyze: >-
  The data collected by your plan is above. Now write the final answer to the user's question,
  following your method. Use the calculate tool for every arithmetic step you still need.
  No more data can be collected.
empty_retry: >-
  Your last reply was empty. Write the final answer now,
  or call calculate if you need a computation first.
