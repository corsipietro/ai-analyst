[project]
name = "sim-analyst"
version = "0.1.0"
description = "A generic, local LLM data analyst: write a short context file, point to the data, ask questions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pietro Corsi" }]
# Versions pinned to the environment the bench was run with (Python 3.14, macOS).
dependencies = [
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "langchain-core==1.7.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.18",
    "ollama==0.6.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
sim-analyst = "sim_analyst.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim_analyst*"]

[tool.setuptools.package-data]
sim_analyst = ["prompts/*.md", "prompts/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
