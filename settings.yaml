# Run settings shared by every domain. A domain's config.yaml may override any of them
# under a "settings:" key. Nothing here is specific to a simulated system.

prompt: v3                 # sim_analyst/prompts/method_<prompt>.md and roles_<prompt>.yaml

graph: v2                  # v2 = explorer + interpreter (graph.py); rewoo = planner -> steps run in code -> analyst (rewoo.py)
answer_language: English   # run setting, not part of the method: added to the instructions by the code

provider: ollama           # the only provider implemented so far (see sim_analyst/llm.py)

# Roles of the graphs: explorer + interpreter (v2), planner + analyst (rewoo). Sampling and token limits live here, never in the code.
roles:
  explorer:                # collects data with the tools; no reasoning, deterministic
    model: gemma4:12b
    reasoning: false
    temperature: 0
    max_tokens: 512        # a tool call costs 20-40 tokens: the cap stops a written draft early
  interpreter:             # writes the final answer; reasoning on, Google's sampling for Gemma 4
    model: gemma4:12b
    reasoning: true
    temperature: 1.0
    top_k: 64
    top_p: 0.95
    max_tokens: 8192       # per call, reasoning included
  planner:                 # rewoo graph: writes the plan of tool calls; same settings as the interpreter
    model: gemma4:12b
    reasoning: true
    temperature: 1.0
    top_k: 64
    top_p: 0.95
    max_tokens: 8192
  analyst:                 # rewoo graph: writes the final answer; same settings as the interpreter
    model: gemma4:12b
    reasoning: true
    temperature: 1.0
    top_k: 64
    top_p: 0.95
    max_tokens: 8192

limits:
  max_rows: 200            # rows returned by query_results
  max_points: 40           # points per group returned by describe_trends
  max_total_points: 80     # points of series_sampled summed over all the groups of one describe_trends
  recursion_limit: 30      # graph steps per question
  empty_retries: 1         # times the interpreter is asked again after an empty reply
  calculate_calls: 8       # calculate calls the rewoo analyst may make; then it must answer
  handoffs: 1              # times the work goes back to the explorer after an empty reply

bootstrap:
  resamples: 2000
  seed: 12345              # fixed: the same data always give the same interval
  confidence: 0.95
  min_n: 30                # the bootstrap interval is reported (never deciding) only with at least this many values per group

analysis:                  # thresholds of the tools (tools.py): what counts as a category, an identifier, a link, a trend
  category_max_values: 20  # a text column with at most this many distinct values (and repeating) is a category
  measure_name_share: 0.5  # share of rows that must become duplicates when a category is removed
  link_share: 0.95         # share of a column's distinct values a unique column must contain to be a link target
  number_share: 0.8        # share of numeric-looking values that makes a text column "numbers stored as text"
  max_groups: 20           # groups returned by describe_trends
  max_at_values: 20        # values accepted in 'at' by summarize_results
  max_items: 10            # items of each list in check_quality
  max_listed_values: 20    # distinct values listed by describe_database
  trend_last_fraction: 0.2 # last part of the range of x on which describe_trends computes the slope
  min_points_per_group: 6  # fewest points of series_sampled per group when several groups share max_total_points
  default_points: 12       # points of series_sampled when step is not given
  x_tolerance: 1.0e-9      # numbers of x and numeric filters are equal if |a - b| <= x_tolerance * max(1, |b|)
  grid_max_share: 0.5      # a non-integer number column with at most this share of distinct values per value is a grid
                           # of x (it enters the keys of is_measure_name), not a continuous measure
  identifier_min_share: 0.95  # a text or integer column with this share of distinct values (but not all) is an
                              # identifier with some repeats (check_quality)
