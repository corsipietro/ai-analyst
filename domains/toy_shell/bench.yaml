# Test bench of the toy_shell domain. Expected answers were written BEFORE building the analyst
# (pre-registration, 27/10/2026).
# They are read only by the person grading the answers: never by the analyst.
mode: A            # read-only: the analyst only queries the frozen database

questions:
  1a: There is an experiment in the database. Describe what was done and what the results show about the debris. How reliable are the conclusions?
  1b: "I ran an experiment with the simulator and the results are in the database. Give me a report: what was varied, what is observed, and what can be concluded with confidence?"
  1c: I have to present the results of the experiment saved in the database to my manager. Summarize what the data say and point out what is not solid.
  2a: How does the debris at year 60 depend on the number of launches?
  2b: What effect does the number of launches per year have on the amount of debris at the end of the simulation?
  2c: Summarize in a table the debris at year 60 for each value of launches, and comment on what can be learned from it.
  3a: How does the debris evolve over time for the different values of launches? Explain the behavior with the model equations.
  3b: Describe the trend of the debris over the years for each value of launches and explain what it depends on, using the model equations.
  3c: Compare the cases of the experiment over time and use the model equations to explain what you observe.

expected:          # point -> what the answer must recognize
  1: {level: basic, text: "21 runs = 7 values of launches x 3 repetitions; 2562 rows in series"}
  2: {level: basic, text: "mean debris at year 60 grows with launches (570 -> 2827) but not monotonically (60 > 70)"}
  3: {level: medium, text: "the non-monotonicity is noise: the min-max spread between repetitions is comparable to the differences between means"}
  4: {level: medium, text: "3 repetitions are not enough: more runs (and confidence intervals) are needed"}
  5: {level: hard, text: "from year 30 to 60: decline below the threshold, almost flat for 70-90, growth above (critical slowing down)"}
  6: {level: hard, text: "theoretical threshold at 80 launches (f*alpha*S*tau = 1 with S ~ 5L), derivable from the equations in the context"}
  7: {level: hard, text: "model limits: fractional satellites, a single shell, no maneuvers, no debris-debris collisions"}
  8: {level: bonus, text: "unrealistic parameters (alpha, f); not required without external sources"}

grades: [recognized, partial, missed, invented number, false premise on the data, false computation]

families:          # which points each family of questions mainly tests
  "1": [1, 2, 3, 4, 7]
  "2": [2, 3, 4]
  "3": [5, 6, 7]

targets:           # what is TRUE in the data, per family: used by the grader for B2, B5 (and A1, A2). Rubric: bench/rubric.yaml
  "1":
    - "21 runs = 7 values of launches x 3 repetitions; yearly series of S and N for every run (2562 rows in series)"
    - "mean debris at the last year grows overall with launches (about 570 -> 2827) but not monotonically (60 > 70)"
    - "the non-monotonic step is within the noise: the min-max spread between repetitions is comparable to the differences between means"
    - "3 repetitions are not enough for firm conclusions"
    - "limits NOT written in the context, e.g. no manoeuvres, no debris-debris collisions"
  "2":
    - "mean debris at the last year grows overall with launches (about 570 -> 2827) but not monotonically (60 > 70)"
    - "the non-monotonic step is within the noise (spread between repetitions comparable to the differences)"
    - "3 repetitions are not enough for firm conclusions"
  "3":
    - "from year 30 to 60: debris declines for few launches, is almost flat around 70-90, grows for many launches"
    - "threshold derivable from the equations: S* = 1/(f*alpha*tau) = 400 and S ~ L*T, hence L* ~ 80"
    - "limits NOT written in the context, e.g. no manoeuvres, no debris-debris collisions"
  excluded: "point 8 (unrealistic parameters) is stated in the context: not graded"

auto_checks:       # numbers searched in the answers to help the grader (never a grade by themselves)
  "1": [21, 2562, 570, 2827]
  "2": [570, 2827]
  "3": [400, 80]

